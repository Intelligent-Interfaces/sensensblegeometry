name: Sensensble Geometry CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Build Frontend & Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      - name: Run Engine Tests
        run: cd engine && cargo test
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build Engine (WASM)
        run: cd engine && wasm-pack build --target web
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run check
      - run: cd frontend && npm run build

  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
      - name: Validate Protobuf Schema
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          mkdir -p temp_out
          protoc --python_out=temp_out --go_out=temp_out backend/proto/geometry.proto
      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          cd backend && golangci-lint run
      - run: cd backend && go build -v ./...

  ml:
    name: Test ML Copilot Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/worker/requirements.txt
      - run: cd backend/worker && pip install -r requirements.txt
      - name: Run Ruff Linter
        run: cd backend/worker && ruff check .
      - name: Integration Smoke Test
        run: |
          cd backend/worker
          python main.py &
          sleep 3
          python smoke_test.py
